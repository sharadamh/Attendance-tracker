{% extends "base.html" %}
{% block title %}Employees — Attendance Tracker{% endblock %}
{% block page_title %}Employees{% endblock %}

{% block content %}
<section class="section">
  <div class="toolbar">
    <input type="text" id="searchInput" class="input" placeholder="Search by name, ID, department…" />
    <button class="btn btn--primary" id="btnAddEmployee">+ Add Employee</button>
  </div>

  <div class="table-wrapper">
    <table class="table" id="employeesTable">
      <thead>
        <tr>
          <th>Employee ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Department</th>
          <th>Designation</th>
          <th>Phone</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="employeesBody">
        <tr><td colspan="7" class="text-center text-muted">Loading…</td></tr>
      </tbody>
    </table>
  </div>
  <p id="employeesCount" class="text-muted mt-sm"></p>
</section>
{% endblock %}

{% block scripts %}
<script>
let editingId = null;

function employeeForm(data = {}) {
  return `
  <form id="employeeForm" class="form">
    <div class="form-row">
      <div class="form-group">
        <label>Employee ID *</label>
        <input name="employee_id" class="input" required value="${esc(data.employee_id)}" placeholder="e.g. EMP001" />
      </div>
      <div class="form-group">
        <label>Full Name *</label>
        <input name="name" class="input" required value="${esc(data.name)}" placeholder="Full name" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Email *</label>
        <input name="email" type="email" class="input" required value="${esc(data.email)}" placeholder="email@example.com" />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input name="phone" class="input" value="${esc(data.phone)}" placeholder="+1234567890" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Department *</label>
        <input name="department" class="input" required value="${esc(data.department)}" placeholder="e.g. Mathematics" />
      </div>
      <div class="form-group">
        <label>Designation *</label>
        <input name="designation" class="input" required value="${esc(data.designation)}" placeholder="e.g. Professor" />
      </div>
    </div>
    <div class="btn-group mt-1">
      <button type="submit" class="btn btn--primary">${editingId ? "Update" : "Create"} Employee</button>
      <button type="button" class="btn btn--outline" id="btnCancelForm">Cancel</button>
    </div>
  </form>`;
}

function loadEmployees(search = "") {
  const url = search ? `/api/employees?search=${encodeURIComponent(search)}` : "/api/employees";
  fetch(url)
    .then(r => r.json())
    .then(res => {
      const tbody = document.getElementById("employeesBody");
      if (!res.success || res.data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">No employees found.</td></tr>`;
        document.getElementById("employeesCount").textContent = "";
        return;
      }
      tbody.innerHTML = res.data.map(e => `
        <tr>
          <td><strong>${esc(e.employee_id)}</strong></td>
          <td>${esc(e.name)}</td>
          <td>${esc(e.email)}</td>
          <td>${esc(e.department)}</td>
          <td>${esc(e.designation)}</td>
          <td>${esc(e.phone||"—")}</td>
          <td class="actions">
            <button class="btn btn--sm btn--outline" onclick="openEdit(${e.id})">Edit</button>
            <button class="btn btn--sm btn--danger" onclick="deleteEmployee(${e.id}, '${esc(e.name)}')">Delete</button>
          </td>
        </tr>`).join("");
      document.getElementById("employeesCount").textContent = `Showing ${res.total} employee(s)`;
    });
}

function openAdd() {
  editingId = null;
  openModal("Add Employee", employeeForm({}));
  setupFormHandler();
}

function openEdit(id) {
  fetch(`/api/employees/${id}`)
    .then(r => r.json())
    .then(res => {
      if (!res.success) { showNotification(res.message, "error"); return; }
      editingId = id;
      openModal("Edit Employee", employeeForm(res.data));
      setupFormHandler();
    });
}

function setupFormHandler() {
  document.getElementById("employeeForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = Object.fromEntries(fd.entries());

    const url = editingId ? `/api/employees/${editingId}` : "/api/employees";
    const method = editingId ? "PUT" : "POST";

    const res = await apiFetch(url, method, payload);
    if (res.success) {
      closeModal();
      showNotification(res.message, "success");
      loadEmployees();
    } else {
      showNotification(res.message || "Error saving employee", "error");
    }
  });
  document.getElementById("btnCancelForm").addEventListener("click", closeModal);
}

function deleteEmployee(id, name) {
  openConfirm(`Delete employee "${name}"?`, async () => {
    const res = await apiFetch(`/api/employees/${id}`, "DELETE");
    if (res.success) {
      showNotification(res.message, "success");
      loadEmployees();
    } else {
      showNotification(res.message, "error");
    }
  });
}

document.addEventListener("DOMContentLoaded", () => {
  loadEmployees();
  document.getElementById("btnAddEmployee").addEventListener("click", openAdd);

  let debounce;
  document.getElementById("searchInput").addEventListener("input", (e) => {
    clearTimeout(debounce);
    debounce = setTimeout(() => loadEmployees(e.target.value.trim()), 300);
  });
});
</script>
{% endblock %}
